<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>StudySync — Academic Task Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-icon">⬡</span>
        <span class="brand-name">StudySync</span>
      </div>
      <nav class="nav">
        <a href="#" class="nav-item active" data-view="dashboard">
          <span class="nav-icon">◈</span> Dashboard
        </a>
        <a href="#" class="nav-item" data-view="assignments">
          <span class="nav-icon">◉</span> Assignments
        </a>
        <a href="#" class="nav-item" data-view="groups">
          <span class="nav-icon">◎</span> Group Tasks
        </a>
        <a href="#" class="nav-item" data-view="calendar">
          <span class="nav-icon">◷</span> Calendar
        </a>
        <a href="#" class="nav-item" data-view="reminders">
          <span class="nav-icon">◆</span> Reminders
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-card">
          <div class="user-avatar">RS</div>
          <div class="user-info">
            <div class="user-name">Rahul S.</div>
            <div class="user-role">Student</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="top-bar">
        <button class="hamburger" id="hamburger">&#9776;</button>
        <div class="page-title" id="page-title">Dashboard</div>
        <div class="top-actions">
          <button class="btn-add" id="open-modal">+ Add Assignment</button>
          <div class="notif-bell" id="notif-bell">
            🔔
            <span class="notif-badge" id="notif-count">0</span>
          </div>
        </div>
      </header>

      <!-- Views -->
      <div class="view active" id="view-dashboard">
        <div class="stats-row">
          <div class="stat-card accent-orange">
            <div class="stat-num" id="stat-total">0</div>
            <div class="stat-label">Total Tasks</div>
          </div>
          <div class="stat-card accent-blue">
            <div class="stat-num" id="stat-pending">0</div>
            <div class="stat-label">Pending</div>
          </div>
          <div class="stat-card accent-green">
            <div class="stat-num" id="stat-done">0</div>
            <div class="stat-label">Completed</div>
          </div>
          <div class="stat-card accent-red">
            <div class="stat-num" id="stat-overdue">0</div>
            <div class="stat-label">Overdue</div>
          </div>
        </div>
        <div class="section-heading">Due This Week</div>
        <div class="task-list" id="dashboard-tasks"></div>
      </div>

      <div class="view" id="view-assignments">
        <div class="filter-bar">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="pending">Pending</button>
          <button class="filter-btn" data-filter="completed">Completed</button>
          <button class="filter-btn" data-filter="overdue">Overdue</button>
        </div>
        <div class="task-list" id="all-tasks"></div>
      </div>

      <div class="view" id="view-groups">
        <div class="group-header">
          <div class="section-heading">Group Projects</div>
          <button class="btn-add-small" id="open-group-modal">+ New Group Task</button>
        </div>
        <div class="group-board" id="group-board">
          <div class="kanban-col">
            <div class="kanban-header todo">📋 To Do</div>
            <div class="kanban-items" id="kanban-todo"></div>
          </div>
          <div class="kanban-col">
            <div class="kanban-header inprogress">⚡ In Progress</div>
            <div class="kanban-items" id="kanban-inprogress"></div>
          </div>
          <div class="kanban-col">
            <div class="kanban-header done">✅ Done</div>
            <div class="kanban-items" id="kanban-done"></div>
          </div>
        </div>
      </div>

      <div class="view" id="view-calendar">
        <div class="calendar-container">
          <div class="cal-nav">
            <button id="cal-prev">&#8592;</button>
            <h2 id="cal-month-label"></h2>
            <button id="cal-next">&#8594;</button>
          </div>
          <div class="cal-grid-header">
            <div>Sun</div><div>Mon</div><div>Tue</div>
            <div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
          </div>
          <div class="cal-grid" id="cal-grid"></div>
        </div>
      </div>

      <div class="view" id="view-reminders">
        <div class="section-heading">Upcoming Deadlines</div>
        <div class="reminder-list" id="reminder-list"></div>
      </div>
    </main>
  </div>

  <!-- Add Assignment Modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h3>New Assignment</h3>
        <button class="modal-close" id="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <label>Title *</label>
        <input type="text" id="task-title" placeholder="e.g. DSA Assignment 3" />

        <label>Subject</label>
        <input type="text" id="task-subject" placeholder="e.g. Computer Science" />

        <label>Due Date *</label>
        <input type="date" id="task-due" />

        <label>Priority</label>
        <select id="task-priority">
          <option value="high">🔴 High</option>
          <option value="medium" selected>🟡 Medium</option>
          <option value="low">🟢 Low</option>
        </select>

        <label>Notes</label>
        <textarea id="task-notes" placeholder="Optional notes..."></textarea>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" id="modal-cancel">Cancel</button>
        <button class="btn-save" id="modal-save">Save Assignment</button>
      </div>
    </div>
  </div>

  <!-- Add Group Task Modal -->
  <div class="modal-overlay" id="group-modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h3>New Group Task</h3>
        <button class="modal-close" id="group-modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <label>Task Title *</label>
        <input type="text" id="group-task-title" placeholder="e.g. Design UI Mockup" />

        <label>Assigned To</label>
        <input type="text" id="group-task-member" placeholder="e.g. Priya, Ravi" />

        <label>Status</label>
        <select id="group-task-status">
          <option value="todo">To Do</option>
          <option value="inprogress">In Progress</option>
          <option value="done">Done</option>
        </select>

        <label>Due Date</label>
        <input type="date" id="group-task-due" />
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" id="group-modal-cancel">Cancel</button>
        <button class="btn-save" id="group-modal-save">Save Task</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
